# Settings compiled into the Switch NRO (src/naruto_app.h, BuiltInConfig); a naruto.toml next to the NRO overrides them.

# The game: the extracted disc in game/ next to the NRO (sdmc:/switch/naruto-nx/game), found by src/naruto_app.h
# (OnConfigurePaths). Your own copy; nothing from the game is distributed.
# Renut's Direct3D-level renderer on deko3d (no GPU plugin).
gpu_plugin = ""
sa2_renderer = "renut"
renut_gpu_backend = "deko3d"
license_mask = 1
log_level = "info"
log_to_file = true
# The render resolution follows sa2_render_height_handheld / _docked (the player's naruto.toml, app/naruto_switch.toml;
# 720 both by default). Needs the GLSL package without the 1x-only passes (tools/switch/shader_package.sh).
sa2_gpu_render_scale = true
sa2_render_height_handheld = 720
sa2_render_height_docked = 720
