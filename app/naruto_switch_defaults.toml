# Settings compiled into the Switch NRO (src/naruto_app.h, BuiltInConfig); a naruto.toml next to the NRO overrides them.

# The extracted disc on the SD card (your own copy; nothing from the game is distributed).
game_data_root = "sdmc:/switch/naruto-nx/game"
# Stage 6 first boot: no renderer yet.
gpu_plugin = ""
license_mask = 1
log_level = "info"
log_to_file = true
