# Code generation options for speed (sa2-nx app/perf_overrides.toml, its "optimised codegen" flavour, first part).
# Root keys, included by both modules of naruto_manifest.toml. Build-time: measured as an A/B pair on the console.
#
# Only options that change how the C++ is written, so the compiler can keep guest state in host registers and drop
# dead stores; the guest-visible result is the same (masseffect-nx measured, UnleashedRecomp-NX / sa2-nx ship them):
#   - cr0-cr7, ctr, xer and the lwarx reservation as C++ locals. Risk shared with sa2-nx: after a guest longjmp ReXGlue
#     restores ctx, not these locals (the setjmp caller must recompute them, as MSVC code does);
#   - skip_msr: no mfmsr/mtmsrd fences, ctx.msr stores or global lock around guest atomic sequences (stwcx. is
#     already a compare-and-swap);
#   - dform_disp_split: D-form loads/stores as base + zext(reg) + disp (differs only when reg + disp crosses 2^32,
#     a guest fault either way);
#   - fctiwz_inline: fctiwz as fcvtzs + NaN select.
# Not yet (need audits of this game's code, sa2-nx docs/enhancements.md): non_volatile_as_local, elide_lr_stores,
# non_argument_as_local, and the post-codegen steps (no-volatile guest memory with loop barriers, direct calls).
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
# Step 3 (sa2-nx round 7, masseffect-nx's "diet": -10 % main thread): r14-r31, f14-f31, v14-v31/v64-v127 as C++
# locals (no __savegprlr/__restgprlr, no guest-stack traffic for them) and no `ctx.lr = <return address>` before every
# call. A function that reads one of them before writing it (a split piece or a funclet that uses its parent's
# registers) must be marked share_registers: tools/read_before_write.py on the generated code lists them.
non_volatile_as_local = true
elide_lr_stores = true
# Float mode (sa2-nx round 7 and its CPU round of 2026-10-12; Gemini's review, tools/gemini/tasks/cpu_codegen_steps.md):
# on the A57 every host flush-mode switch is an `msr fpcr` (43 ns measured on this console, rex_profile.log). Moves
# and compares whose result does not depend on the mode switch nothing; before a switch the generator looks ahead
# (not past a branch: sa2-nx measured that as a loss).
fp_moves_modeless = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = false
